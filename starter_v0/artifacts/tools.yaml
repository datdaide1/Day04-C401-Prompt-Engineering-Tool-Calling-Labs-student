# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại user đúng một câu khi thiếu thông tin bắt buộc hoặc cần xác nhận. Luôn truyền response_type rõ ràng: text cho thiếu account/URL, yes_no cho xác nhận gửi/đăng/publish, choice khi có options."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi ngắn, chỉ hỏi phần thông tin còn thiếu hoặc hỏi xác nhận hành động."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Bắt buộc set rõ. Dùng text khi cần account/handle/URL; yes_no khi user muốn send/post/publish nhưng chưa xác nhận; choice khi cần chọn từ options."}
        options: {type: array, default: [], items: {type: string}, description: "Chỉ điền khi response_type=choice; để [] cho text hoặc yes_no."}
      required: [question, response_type]

  - name: timeline
    description: "Lấy bài đăng/tweet gần đây từ một account cụ thể. Chỉ dùng khi user nêu rõ người hoặc handle; nếu thiếu account thì dùng clarify, không đoán."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle không có @. Map tên phổ biến khi rõ: Sam Altman -> sama, Elon Musk -> elonmusk, Andrej Karpathy -> karpathy."}
        limit: {type: integer, default: 5, description: "Số bài đăng cần lấy. Tôn trọng số user nói rõ, ví dụ 10 tweet -> limit=10; mặc định 5."}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng/tweet theo chủ đề hoặc keyword trên mạng xã hội. Dùng cho câu hỏi 'mọi người đang bàn gì', tweet về một chủ đề, hoặc top/popular posts; không dùng cho tweet của một account cụ thể."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề/keyword sạch để tìm trên social, ví dụ GPT-5 hoặc OpenAI."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Latest mặc định; dùng Top khi user nói top, phổ biến, viral, nổi bật nhất."}
        limit: {type: integer, default: 5, description: "Số kết quả cần lấy. Tôn trọng số user nói rõ; mặc định 5."}
      required: [query]

  - name: lookup
    description: "Tìm kiếm web bằng Tavily cho thông tin hiện tại, tin tức, hoặc câu hỏi cần web search. Dùng topic=news cho tin tức/current events. Giữ query là chủ đề sạch, không nhét news/today/this week vào query."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề sạch cần tìm, ví dụ AI, robotics, OpenAI. Không dùng 'AI news today'; hãy dùng query=AI, topic=news, timeframe=day."}
        topic: {type: string, enum: [general, news], default: "general", description: "news cho tin tức/current events; general cho tra cứu web chung."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian cho news: hôm nay/today -> day; tuần này/this week -> week; tháng này -> month; năm nay -> year."}
        max_results: {type: integer, default: 5, description: "Số kết quả web cần lấy. Tôn trọng số user nói rõ; mặc định 5."}
      required: [query]

  - name: fetch
    description: "Đọc nội dung từ một URL cụ thể bằng Firecrawl. Chỉ dùng khi user cung cấp link/URL rõ ràng; nếu user nói 'bài này' hoặc 'this article' nhưng không có URL thì dùng clarify."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL đầy đủ cần đọc, ví dụ https://openai.com/blog/gpt-5."}
      required: [url]

  - name: format
    description: "Trình bày các items đã có thành markdown digest. Tool này không tìm kiếm, không đọc URL, không gọi API dữ liệu mới; chỉ dùng sau khi đã có items từ tool khác hoặc từ user."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item đã có sẵn để format; không tự tạo item giả."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Kiểu trình bày: brief ngắn, bullets gạch đầu dòng, sections theo mục, thread dạng chuỗi post, daily_ai_vn cho bản tin AI tiếng Việt."}
        headline: {type: string, default: "", description: "Tiêu đề markdown nếu user yêu cầu hoặc nếu cần digest có headline."}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: github
    description: "Tìm kiếm repository trên GitHub hoặc lấy thông tin chi tiết của một repo."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm (chỉ dùng khi không truyền repository)"}
        repository: {type: string, default: "", description: "Tên đầy đủ của repo dạng 'owner/repo' (ví dụ: 'facebookresearch/llama')"}
        sort: {type: string, enum: [stars, forks, updated], default: "stars", description: "Tiêu chí sắp xếp"}
      required: []

